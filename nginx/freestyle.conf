# ════════════════════════════════════════════════════════════════
#  nginx — раздаёт SPA + проксирует /api/* в server-контейнер
#  HTTPS терминируется внешним certbot/nginx-proxy на хосте reg.ru
#  (или подменяется на entry в docker-compose с volume на /etc/letsencrypt).
# ════════════════════════════════════════════════════════════════

server {
    listen 80 default_server;
    server_name _;

    # ─── Безопасность ────────────────────────────────────────────
    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Лог-уровень для отладки в проде
    access_log /var/log/nginx/access.log combined;
    error_log /var/log/nginx/error.log warn;

    # Размер тела (документы/аватары могут быть тяжёлыми)
    client_max_body_size 16M;

    # ─── API → server-контейнер ──────────────────────────────────
    location /api/ {
        proxy_pass http://server:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ─── Статика (Vite-билд с хешами в именах) ──────────────────
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # ─── SPA fallback ────────────────────────────────────────────
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        # HTML не кэшируем чтобы откатываться быстро
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;
}
