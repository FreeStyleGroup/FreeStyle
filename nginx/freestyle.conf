# ════════════════════════════════════════════════════════════════
#  nginx — раздаёт SPA + проксирует /api/* в server-контейнер.
#  HTTPS терминируется здесь (сертификат Let's Encrypt смонтирован
#  томом /etc/letsencrypt из хоста — см. docker-compose.prod.yml).
#  Редиректы: http → https и www → без www (канон https://freestyle.ru).
# ════════════════════════════════════════════════════════════════

# ─── HTTP (80): ACME-челлендж + редирект на https/без-www ─────────
server {
    listen 80 default_server;
    server_name freestyle.ru www.freestyle.ru _;

    # Webroot для продления сертификата (certbot renew --webroot -w /var/www/certbot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://freestyle.ru$request_uri;
    }
}

# ─── HTTPS (443): основной сервер ────────────────────────────────
server {
    listen 443 ssl default_server;
    http2 on;
    server_name freestyle.ru www.freestyle.ru;

    ssl_certificate     /etc/letsencrypt/live/freestyle.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/freestyle.ru/privkey.pem;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # www → без www (на случай, если www когда-нибудь зарезолвится)
    if ($host = www.freestyle.ru) {
        return 301 https://freestyle.ru$request_uri;
    }

    # ─── Безопасность ────────────────────────────────────────────
    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    access_log /var/log/nginx/access.log combined;
    error_log /var/log/nginx/error.log warn;

    # Размер тела (документы/аватары могут быть тяжёлыми)
    client_max_body_size 16M;

    # ─── API → server-контейнер ──────────────────────────────────
    location /api/ {
        proxy_pass http://server:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ─── Статика (Vite-билд с хешами в именах) ──────────────────
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # ─── SPA fallback ────────────────────────────────────────────
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        # HTML не кэшируем чтобы откатываться быстро
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;
}
